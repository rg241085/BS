<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Payment Ledger</title>
    <style>
        /* Modern System Fonts */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 1050px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        /* Header & Action Buttons */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header-section h2 {
            margin: 0;
            color: #1e293b;
            font-size: 24px;
            display: flex;
            align-items: center;
        }

        .main-header-amount {
            color: #ef4444;
            font-size: 20px;
            margin-left: 12px;
            font-weight: 700;
        }

        .main-header-entries {
            color: #64748b;
            font-size: 16px;
            margin-left: 8px;
            font-weight: 600;
        }

        .header-actions button {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
            transition: 0.2s;
        }

        .btn-print {
            background: #475569;
            color: white;
        }

        .btn-print:hover {
            background: #334155;
        }

        .btn-clear {
            background: #fee2e2;
            color: #ef4444;
        }

        .btn-clear:hover {
            background: #fca5a5;
            color: white;
        }

        /* Input Form Area */
        .form-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 30px;
        }

        .grid-input {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr 1.5fr;
            gap: 15px;
            align-items: end;
        }

        .narration-span {
            grid-column: span 3;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }

        input {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .btn-add {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            height: 46px;
        }

        .btn-add:hover {
            background: #2563eb;
        }

        /* Table Design */
        .table-grid {
            display: grid;
            grid-template-columns: 110px 100px 2fr 1.5fr 2fr 100px;
            gap: 15px;
            align-items: center;
            text-align: left;
        }

        .table-header {
            background: #1e293b;
            color: white;
            font-weight: 600;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sortable:hover {
            color: #93c5fd;
        }

        .list-container {
            border: 1px solid #e2e8f0;
            border-top: none;
            border-radius: 0 0 8px 8px;
            background: white;
        }

        .list-item {
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
        }

        .list-item:hover {
            background: #f8fafc;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .date-text {
            font-size: 12px;
            color: #64748b;
        }

        .bill-text {
            font-size: 13px;
            color: #475569;
            font-weight: 500;
        }

        .name-text {
            font-weight: 600;
            color: #0f172a;
            font-size: 15px;
        }

        .amount-text {
            font-weight: 700;
            color: #ef4444;
            font-size: 16px;
        }

        .narration-text {
            color: #475569;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .icon-btn {
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: 0.2s;
        }

        .edit-btn:hover {
            background: #fef08a;
            color: #ca8a04;
        }

        .delete-btn:hover {
            background: #bbf7d0;
            color: #16a34a;
        }

        .empty-msg {
            padding: 30px;
            color: #94a3b8;
            text-align: center;
            font-style: italic;
        }

        /* PRINT SETTINGS */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                max-width: 100%;
                padding: 0;
            }

            .header-actions,
            .form-card,
            .actions,
            .action-header {
                display: none !important;
            }

            .table-grid {
                grid-template-columns: 110px 100px 2fr 1.5fr 2fr;
            }

            .sortable {
                color: black !important;
            }
        }

        /* MOBILE RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .header-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header-actions {
                width: 100%;
                display: flex;
                gap: 10px;
            }

            .header-actions button {
                margin-left: 0;
                flex: 1;
                padding: 12px;
            }

            .main-header-amount {
                display: block;
                margin-left: 0;
                margin-top: 5px;
            }

            .grid-input {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .narration-span {
                grid-column: span 1;
            }

            .btn-add {
                margin-top: 8px;
                height: 50px;
            }

            .table-header {
                display: none;
            }

            .list-container {
                border: none;
                background: transparent;
            }

            .table-grid.list-item {
                display: flex;
                flex-direction: column;
                position: relative;
                background: #fff;
                border: 1px solid #e2e8f0;
                border-radius: 10px;
                padding: 15px;
                margin-bottom: 15px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
                gap: 6px;
            }

            .date-text {
                font-size: 12px;
                margin-bottom: 2px;
            }

            .name-text {
                font-size: 18px;
                padding-right: 80px;
            }

            .amount-text {
                font-size: 20px;
            }

            .narration-text {
                margin-top: 4px;
                border-top: 1px dashed #e2e8f0;
                padding-top: 8px;
            }

            .actions {
                position: absolute;
                top: 15px;
                right: 15px;
                gap: 8px;
            }

            .icon-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-section">
            <h2>
                📊 Financial Ledger
                <span class="main-header-amount" id="mainHeaderAmount">(₹0)</span>
                <span class="main-header-entries" id="mainHeaderEntries">(0)</span>
            </h2>
            <div class="header-actions">
                <button class="btn-clear" onclick="clearAllData()">🗑️ Clear All</button>
                <button class="btn-print" onclick="window.print()">🖨️ Print / PDF</button>
            </div>
        </div>

        <div class="form-card">
            <div class="grid-input">
                <div class="input-group">
                    <label>1. DATE</label>
                    <input type="date" id="dateInput">
                </div>
                <div class="input-group">
                    <label>2. BILL NO.</label>
                    <input type="text" id="billNo" placeholder="e.g. DRY-101">
                </div>
                <div class="input-group">
                    <label>3. PAYEE NAME</label>
                    <input type="text" id="name" placeholder="Name of person/supplier">
                </div>
                <div class="input-group">
                    <label>4. AMOUNT (₹)</label>
                    <input type="number" id="amt" placeholder="0.00">
                </div>
                <div class="input-group narration-span">
                    <label>5. NARRATION / DETAILS</label>
                    <input type="text" id="narration" placeholder="Almonds vendor, Packaging bill, etc...">
                </div>
                <button class="btn-add" id="mainBtn" onclick="addOrUpdatePayment()">+ ADD ENTRY</button>
            </div>
        </div>

        <div class="table-grid table-header">
            <div class="sortable" onclick="handleSort('date')" id="head-date">DATE 🔽</div>
            <div>BILL NO.</div>
            <div class="sortable" onclick="handleSort('name')" id="head-name">NAME ↕️</div>
            <div class="sortable" onclick="handleSort('amount')" id="head-amount">AMOUNT ↕️</div>
            <div>NARRATION</div>
            <div class="action-header" style="text-align: center;">ACTION</div>
        </div>

        <div class="list-container" id="paymentList"></div>
    </div>

    <script type="module">
        import { db, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from './firebase-config.js';

        let payments = [];
        let editingId = null;
        let sortCol = 'date';
        let sortAsc = false; // false = descending (naya pehle)

        const formatMoney = (num) => {
            return Number(num).toLocaleString('en-IN');
        };

        // Security logic for escaping HTML
        const escapeHTML = (str) => {
            if (!str) return '';
            let div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        };

        const paymentsCol = collection(db, "payments");

        // Fetch Data from Firebase
        onSnapshot(paymentsCol, (snapshot) => {
            payments = [];
            snapshot.forEach((doc) => {
                payments.push({ id: doc.id, ...doc.data() });
            });
            showPayments();
        });

        // Add or Update Entry
        window.addOrUpdatePayment = async function () {
            let dateInputVal = document.getElementById('dateInput').value;
            let billVal = document.getElementById('billNo').value;
            let nameInput = document.getElementById('name').value;
            let amtInput = document.getElementById('amt').value;
            let narrInput = document.getElementById('narration').value;

            // Agar date select nahi ki toh aaj ki date de do
            if (!dateInputVal) {
                dateInputVal = new Date().toISOString().split('T')[0];
            }

            if (nameInput !== '' && Number(amtInput) > 0) {
                if (!editingId) {
                    await addDoc(paymentsCol, {
                        date: dateInputVal,
                        billNo: billVal,
                        name: nameInput,
                        amount: Number(amtInput),
                        narration: narrInput,
                        timestamp: Date.now()
                    });
                } else {
                    const paymentRef = doc(db, "payments", editingId);
                    await updateDoc(paymentRef, {
                        date: dateInputVal,
                        billNo: billVal,
                        name: nameInput,
                        amount: Number(amtInput),
                        narration: narrInput,
                        timestamp: Date.now()
                    });
                    editingId = null;
                    let btn = document.getElementById('mainBtn');
                    btn.innerText = "+ ADD ENTRY";
                    btn.style.backgroundColor = "#3b82f6";
                }

                // Clear fields after submission
                document.getElementById('dateInput').value = '';
                document.getElementById('billNo').value = '';
                document.getElementById('name').value = '';
                document.getElementById('amt').value = '';
                document.getElementById('narration').value = '';
            } else {
                alert("Please enter a valid Name and an Amount greater than 0!");
            }
        };

        // Edit Entry & Auto Focus
        window.editPayment = function (id) {
            let p = payments.find(pay => pay.id === id);
            if (p) {
                document.getElementById('dateInput').value = p.date || '';
                document.getElementById('billNo').value = p.billNo || '';
                document.getElementById('name').value = p.name;
                document.getElementById('amt').value = p.amount;
                document.getElementById('narration').value = p.narration || "";

                editingId = id;
                let btn = document.getElementById('mainBtn');
                btn.innerText = "✓ UPDATE ENTRY";
                btn.style.backgroundColor = "#eab308";

                // Auto Scroll aur Focus Logic
                document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => {
                    document.getElementById('name').focus();
                }, 300);
            }
        };

        // Delete Entry
        window.deletePayment = async function (id) {
            if (confirm("Mark this as PAID? It will be removed from the list. ✅")) {
                if (editingId === id) {
                    editingId = null;
                    document.getElementById('mainBtn').innerText = "+ ADD ENTRY";
                    document.getElementById('mainBtn').style.backgroundColor = "#3b82f6";
                    document.getElementById('dateInput').value = '';
                    document.getElementById('billNo').value = '';
                    document.getElementById('name').value = '';
                    document.getElementById('amt').value = '';
                    document.getElementById('narration').value = '';
                }
                await deleteDoc(doc(db, "payments", id));
            }
        };

        // Clear All Data
        window.clearAllData = async function () {
            let authKey = prompt("⚠️ SYSTEM WARNING: Action restricted.\n\nEnter Admin Authorization Key:");
            if (authKey === null) return;

            let d = new Date();
            let req = [
                String(d.getDate()).padStart(2, '0'),
                String(d.getMonth() + 1).padStart(2, '0'),
                d.getFullYear(),
                String.fromCharCode(69, 68, 73, 84)
            ].join('');

            if (btoa(authKey) === btoa(req)) {
                const deletePromises = payments.map(p => deleteDoc(doc(db, "payments", p.id)));
                await Promise.all(deletePromises);
                alert("✅ System data cleared successfully.");
            } else {
                alert("❌ Access Denied. Incorrect Key.");
            }
        };

        // Sorting Handler
        window.handleSort = function (column) {
            if (sortCol === column) {
                sortAsc = !sortAsc;
            } else {
                sortCol = column;
                sortAsc = (column === 'name') ? true : false;
            }

            document.getElementById('head-date').innerHTML = 'DATE ' + (sortCol === 'date' ? (sortAsc ? '🔼' : '🔽') : '↕️');
            document.getElementById('head-name').innerHTML = 'NAME ' + (sortCol === 'name' ? (sortAsc ? '🔼' : '🔽') : '↕️');
            document.getElementById('head-amount').innerHTML = 'AMOUNT ' + (sortCol === 'amount' ? (sortAsc ? '🔼' : '🔽') : '↕️');

            showPayments();
        };

        // Display Data
        function showPayments() {
            let listElement = document.getElementById('paymentList');
            let totalPayable = 0;
            listElement.innerHTML = '';

            // Smart Sorting Logic
            payments.sort((a, b) => {
                let valA, valB;

                if (sortCol === 'date') {
                    valA = new Date(a.date).getTime() || 0;
                    valB = new Date(b.date).getTime() || 0;
                    if (valA === valB) {
                        valA = a.timestamp || 0;
                        valB = b.timestamp || 0;
                    }
                } else if (sortCol === 'name') {
                    valA = a.name.toLowerCase();
                    valB = b.name.toLowerCase();
                } else if (sortCol === 'amount') {
                    valA = Number(a.amount);
                    valB = Number(b.amount);
                }

                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });

            if (payments.length === 0) {
                listElement.innerHTML = '<div class="empty-msg">No pending payments. You are all clear! 🎉</div>';
            } else {
                payments.forEach((payment) => {
                    totalPayable += Number(payment.amount);

                    // Date ko sundar format me dikhane ke liye (Optional)
                    let displayDate = payment.date;
                    if (payment.date && payment.date.includes('-')) {
                        let parts = payment.date.split('-');
                        displayDate = `${parts[2]}-${parts[1]}-${parts[0]}`; // DD-MM-YYYY
                    }

                    let row = document.createElement('div');
                    row.className = 'table-grid list-item';

                    // XSS protection (escapeHTML) applied here
                    row.innerHTML = `
                        <div class="date-text">${displayDate}</div>
                        <div class="bill-text">${escapeHTML(payment.billNo) ? escapeHTML(payment.billNo) : '-'}</div>
                        <div class="name-text">${escapeHTML(payment.name)}</div>
                        <div class="amount-text">₹${formatMoney(payment.amount)}</div>
                        <div class="narration-text">${escapeHTML(payment.narration) ? escapeHTML(payment.narration) : '-'}</div>
                        <div class="actions">
                            <button class="icon-btn edit-btn" onclick="editPayment('${payment.id}')" title="Edit">✏️</button>
                            <button class="icon-btn delete-btn" onclick="deletePayment('${payment.id}')" title="Mark as Paid">✅</button>
                        </div>
                    `;
                    listElement.appendChild(row);
                });
            }

            document.getElementById('mainHeaderAmount').innerText = `(₹${formatMoney(totalPayable)})`;
            document.getElementById('mainHeaderEntries').innerText = `(${payments.length})`;
        }
    </script>
</body>

</html>
